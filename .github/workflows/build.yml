name: Native checks and Pico 2 builds

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native DSP and standby checks
        run: bash host/run_native_tests.sh

  firmware:
    needs: native
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        board: [pico2, pico2_w]
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib cmake ninja-build python3 git \
            build-essential libusb-1.0-0-dev pkg-config
      - name: Fetch Pico SDK 2.2.0
        run: |
          git clone --depth 1 --branch 2.2.0 --recurse-submodules \
            https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          echo "PICO_SDK_PATH=$RUNNER_TEMP/pico-sdk" >> "$GITHUB_ENV"
      - name: Build public bench example
        run: PICO_BOARD=${{ matrix.board }} bash ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bench-example-${{ matrix.board }}
          path: pico2_four_stereo_dsp_standby_${{ matrix.board }}.uf2
          if-no-files-found: error
